<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Docs Search Engine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-py">Python</span>
                <span class="logo-docs">Docs Search</span>
            </div>
            <p class="tagline">An educational search engine built from scratch with DSA (Inverted Index, TF-IDF, Trie)</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <form id="search-form" autocomplete="off" onsubmit="return false;">
                <div class="search-box-wrapper">
                    <input 
                        type="text" 
                        id="query-input" 
                        name="q" 
                        placeholder="Search documentation (e.g. 'sort a dictionary', 'lists', 'tuples')..." 
                        autofocus
                    >
                    <button type="submit" id="search-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span>Search</span>
                    </button>
                    <!-- Autocomplete dropdown list -->
                    <ul id="suggestions-list" class="suggestions-list hidden"></ul>
                </div>
            </form>
        </section>

        <!-- Status / Results Summary -->
        <div id="status-bar" class="status-bar"></div>

        <!-- Results Area -->
        <main id="results-container" class="results-container"></main>

        <!-- Footer -->
        <footer class="footer">
            <p>B.Tech CS Project &bull; Hand-crafted Full-Text Search Engine</p>
        </footer>
    </div>

    <!-- Document Preview Modal Popup -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <h2 id="modal-title" class="modal-title"></h2>
                    <span id="modal-file" class="modal-file"></span>
                </div>
                <button type="button" id="modal-close-btn" class="modal-close-btn" aria-label="Close preview">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-preview" class="modal-preview-text"></p>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
